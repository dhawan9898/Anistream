name: Build AniStream v8.1 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v8.1) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Check Version
        run: npm run check-version

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Minified (R8) + resource-shrunk release build, signed with the same
      # key as every earlier release so it installs as an in-place update.
      - name: Build Android APK (release, minified)
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/AniStream-v8.1.apk
          ls -lh build-output/AniStream-v8.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v8.1-APK
          path: build-output/AniStream-v8.1.apk
          retention-days: 30

      # R8 mapping - needed to de-obfuscate stack traces from this build.
      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v8.1-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      # A manual run republishing an existing tag (e.g. rebuilding v8.1)
      # replaces that release and its tag, so the tag always points at the
      # commit this APK was built from. Tag pushes are never touched.
      - name: Replace Existing Release (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: gh release delete "${{ inputs.release_tag }}" --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v8.1.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          # Without this a new tag is created on the default branch, not on
          # the commit that was actually built.
          target_commitish: ${{ github.sha }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v8.1 - Android Anime Streaming App (Powered by ani-cli)

            v8.1 follows up v8.0 with fixes from real-device testing.

            ### 🚀 What's new in v8.1:

            - **Dub only when it exists**: titles without an English dub no longer show a DUB option (title page or player) and never silently play the subbed stream as "dub".
            - **Continue where you left off**: tapping a half-watched episode resumes it; Library entries play directly from the saved position.
            - **Every watched episode is tracked**: the Library History lists each episode you watched (not just the last one per title), with Watched badges on the episode list.
            - **Smoother audio and episode swaps**: the picture stays on screen while the new stream loads instead of tearing the player down.
            - **Live scrubbing**: dragging the seek bar scrubs the real video with a time bubble.
            - **Captions list the player's real tracks**, so picking one (including on dub) shows it.

            ### 📦 Download:
            Download **`AniStream-v8.1.apk`** below and install or update on any Android device running Android 8.0 or later - it updates previous versions in place and keeps your history and My List.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
