name: Build AniStream v3.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v3.0-APK
          path: build-output/AniStream-v3.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v3.0.apk
          tag_name: v3.0
          name: AniStream v3.0 Release
          body: |
            ## AniStream v3.0 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 Updates in this build:

            **Captions - root cause found and fixed:** the player was building its video source directly from `HlsMediaSource`/`ProgressiveMediaSource`, bypassing the only ExoPlayer component that actually merges side-loaded subtitles into playback (`DefaultMediaSourceFactory`). The subtitle track was silently never loaded at all, regardless of format - which is why picking a listed language never showed anything. Switched to `DefaultMediaSourceFactory`, which is the correct, documented way to attach external subtitles. This is a structural fix (not a guess about format/network like earlier attempts) - please verify captions now actually render.

            - **Netflix-style captions/quality sheet**: a proper bottom sheet (dimmed background, rounded panel, big rows with checkmarks) instead of a small dropdown.
            - **Glossier player chrome**: gradient + elevation/shadow on buttons and the sheet instead of flat color.
            - **Real quality menu**: prefers actual adaptive renditions detected in the stream; never shows a fake "1080p/720p/480p" list pointing at the same file.
            - **Fixed homepage flash of fake data**: mock anime list no longer flashes before real trending data loads - now a loading skeleton.
            - **hasNextEpisode / Next Episode fixed**: previously hardcoded to always-true with a fabricated episode id; now looks up the real next episode from the actual episode list, so it can't try to play an episode that doesn't exist.
            - **Settings preferences now actually work**: "Autoplay Next Episode" and "Default Audio" were saved but never read anywhere - now wired in. "Default Quality" is applied when a stream genuinely offers more than one rendition.
            - **No more silent fake-video fallback**: a broken stream used to silently swap in an unrelated sample video with no indication anything failed; now shows a real error message.
            - **Native dialogs replaced**: `window.confirm()`/`alert()` (jarring native browser popups) replaced with a themed in-app modal everywhere.
            - Assorted correctness/consistency fixes: stable list keys (was using array index), fabricated "SUB 12" placeholder removed, light-theme badge contrast fixed, consistent danger-red color token, Settings loading state and version string fixed.

            ### 📦 Download:
            Download **`AniStream-v3.0.apk`** below and install on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
