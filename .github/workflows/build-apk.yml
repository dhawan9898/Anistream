name: Build AniStream v8.3 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v8.3) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Check Version
        run: npm run check-version

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Minified (R8) + resource-shrunk release build, signed with the same
      # key as every earlier release so it installs as an in-place update.
      - name: Build Android APK (release, minified)
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/AniStream-v8.3.apk
          ls -lh build-output/AniStream-v8.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v8.3-APK
          path: build-output/AniStream-v8.3.apk
          retention-days: 30

      # R8 mapping - needed to de-obfuscate stack traces from this build.
      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v8.3-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      # A manual run republishing an existing tag (e.g. rebuilding v8.3)
      # replaces that release and its tag, so the tag always points at the
      # commit this APK was built from. Tag pushes are never touched.
      - name: Replace Existing Release (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: gh release delete "${{ inputs.release_tag }}" --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v8.3.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          # Without this a new tag is created on the default branch, not on
          # the commit that was actually built.
          target_commitish: ${{ github.sha }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v8.3 - Android Anime Streaming App (Powered by ani-cli)

            v8.3 is a reliability release: episodes can be looked up inside the player, newer stream formats are supported, and the app caches to disk.

            ### 🚀 What's new in v8.3:

            - **Next Episode / Sub-Dub switch no longer depend on the app's web layer**: the player looks the stream up itself (falling back to the app only if that fails), warms the next episode shortly before the current one ends, and retries with a fresh link when a stream dies.
            - **Newer embed format supported**: streams whose player page carries its data inline (ZokoAnime) previously could not be resolved at all; they now play, with their intro/outro markers and subtitles.
            - **Real seek preview**: dragging the seek bar shows the stream's own thumbnail for that moment.
            - **Auto-Skip Intro is off by default** (and reset once for existing installs); turn it on in Settings if you want it.
            - **Faster, steadier browsing**: home and genre pages and episode lists are cached on disk (instant restarts, and still shown when the site is unreachable), rails load only when scrolled near, fewer writes while watching.

            ### 📦 Download:
            Download **`AniStream-v8.3.apk`** below and install or update on any Android device running Android 8.0 or later - it updates previous versions in place and keeps your history and My List.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
