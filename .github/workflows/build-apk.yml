name: Build AniStream v5.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v5.0) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v5.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v5.0-APK
          path: build-output/AniStream-v5.0.apk
          retention-days: 30

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v5.0.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v5.0 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 What's new in v5.0:

            - **Tablet & landscape ready**: poster, genre, collection and episode grids now adapt to the screen width (more columns on tablets and wide windows instead of a stretched phone layout), and the layout fills the real viewport height so the bottom dock is never hidden behind mobile browser toolbars.
            - **Faster, more reliable playback loading**: every step of stream resolution now has a timeout, so a stalled server can no longer leave the player spinning forever - it fails cleanly and lets you retry.
            - **Smoother search**: typing is debounced and stale responses are ignored, so results always match what is in the search box and the server isn't hammered on every keystroke.
            - **Safer watch history & My List**: saves are serialized and coalesced, so rapid progress updates can no longer overwrite bookmarks or history entries, and storage is written far less often during playback.
            - Plus everything from v4.x: in-player episode loading, genre browsing, Collection / More Like This, and the Netflix-style player.

            ### 📦 Download:
            Download **`AniStream-v5.0.apk`** below and install or update on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
