name: Build AniStream v6.2 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v6.2) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Minified (R8) + resource-shrunk release build, signed with the same
      # key as every earlier release so it installs as an in-place update.
      - name: Build Android APK (release, minified)
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/AniStream-v6.2.apk
          ls -lh build-output/AniStream-v6.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v6.2-APK
          path: build-output/AniStream-v6.2.apk
          retention-days: 30

      # R8 mapping - needed to de-obfuscate stack traces from this build.
      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v6.2-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      # A manual run republishing an existing tag (e.g. rebuilding v6.2)
      # replaces that release and its tag, so the tag always points at the
      # commit this APK was built from. Tag pushes are never touched.
      - name: Replace Existing Release (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: gh release delete "${{ inputs.release_tag }}" --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v6.2.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          # Without this a new tag is created on the default branch, not on
          # the commit that was actually built.
          target_commitish: ${{ github.sha }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v6.2 - Android Anime Streaming App (Powered by ani-cli)

            ### What's in v6.2:

            - **v6.1 rolled back.** v6.1 broke playback (every episode opened the same video). v6.2 is the v6.0 code exactly, re-released with a higher version number so it installs directly over v6.1 without uninstalling (your history and My List are kept).

            ### From v6.0:

            - **Server fallback**: when the first mirror for an episode is dead, the remaining servers for the same audio (SUB/DUB) are tried before anything falls back to the demo clip.
            - **Self-healing playback**: dropped connections and CDN 5xx errors are retried automatically with backoff (native ExoPlayer and web player), and **Retry** resumes where playback stopped instead of restarting at 0:00.
            - **Accurate Continue Watching**: progress can no longer be saved under the wrong episode while the next one loads, the demo clip never overwrites your resume point, and Home / title page / Library update live after you watch. Finished episodes offer the next episode instead of resuming into the credits.
            - **Lighter & smoother**: the startup bundle is ~65% smaller (the web player loads on demand), progress writes are throttled, player timers/listeners are cleaned up on close, and site pages/episode lists are cached so the source isn't hammered.
            - **Fixes**: correct Skip Intro timing after switching episodes, no stray "0" badges, a real error state (with Retry) when search can't reach the server, subtitle menu no longer lists the thumbnail track, fullscreen state stays in sync.
            - Plus everything from v5.x: tablet/landscape layouts, request timeouts, debounced search, serialized history writes.

            - **Smaller, optimized APK**: now a minified (R8) release build with unused code and resources stripped.

            ### 📦 Download:
            Download **`AniStream-v6.2.apk`** below and install or update on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
