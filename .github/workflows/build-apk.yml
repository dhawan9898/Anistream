name: Build AniStream v4.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v4.0-APK
          path: build-output/AniStream-v4.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v4.0.apk
          tag_name: v4.0
          name: AniStream v4.0 Release
          body: |
            ## AniStream v4.0 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 Updates in this build:

            - **Netflix-style player toolbar**: Episodes / Subtitles / Quality selection moved from the top header down to a toolbar right above the seek bar, matching Netflix's actual mobile layout - each opens a proper bottom sheet with checkmarks, not a small dropdown.
            - **New: Episode picker in the player**: pick any episode of the current anime directly from the player without backing out to the detail screen. Native player reports the pick back to JS, which re-resolves the real stream - never a guessed URL.
            - **New: Per-item history delete**: remove a single watch-history entry without clearing everything.
            - **New: Volume swipe gesture (web player)**: vertical swipe on the right half of the screen adjusts volume, matching the native player's existing gesture support.
            - Fixed a race condition where the very first episode played for an anime could reach the native player before its real episode list had loaded.

            ### 📦 Download:
            Download **`AniStream-v4.0.apk`** below and install on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
