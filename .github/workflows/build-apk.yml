name: Build AniStream v3.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v3.0-APK
          path: build-output/AniStream-v3.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v3.0.apk
          tag_name: v3.0
          name: AniStream v3.0 Release
          body: |
            ## AniStream v3.0 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 Updates in this build:
            - **Netflix-style captions/quality sheet**: replaced the small dropdown menu with a proper bottom sheet (dimmed background, rounded panel, big rows with checkmarks) for picking a subtitle language or quality.
            - **Subtitle format fix**: every subtitle track was being force-parsed as WebVTT regardless of its real format, which silently renders nothing if the track is actually SRT/ASS/TTML. Now the format is detected from the file itself instead of assumed.
            - **Real quality menu**: prefers the actual adaptive renditions detected in the stream (switches in place, no reload) and only falls back to a per-URL quality list when it's a genuine choice - never a fake "1080p/720p/480p" list pointing at the same file.

            Captions were reported not rendering in the previous build; the subtitle format fix above is our best diagnosis of that from the available evidence, not a confirmed fix - please test and report back if captions still don't show.

            ### 📦 Download:
            Download **`AniStream-v3.0.apk`** below and install on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
