name: Build AniStream v7.1 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v7.1) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Check Version
        run: npm run check-version

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      # Minified (R8) + resource-shrunk release build, signed with the same
      # key as every earlier release so it installs as an in-place update.
      - name: Build Android APK (release, minified)
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/AniStream-v7.1.apk
          ls -lh build-output/AniStream-v7.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v7.1-APK
          path: build-output/AniStream-v7.1.apk
          retention-days: 30

      # R8 mapping - needed to de-obfuscate stack traces from this build.
      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v7.1-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      # A manual run republishing an existing tag (e.g. rebuilding v7.1)
      # replaces that release and its tag, so the tag always points at the
      # commit this APK was built from. Tag pushes are never touched.
      - name: Replace Existing Release (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: gh release delete "${{ inputs.release_tag }}" --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v7.1.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          # Without this a new tag is created on the default branch, not on
          # the commit that was actually built.
          target_commitish: ${{ github.sha }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v7.1 - Android Anime Streaming App (Powered by ani-cli)

            v7.1 brings back everything from v6.4 that v7.0 accidentally left out, fixes updating, and makes playback start faster and scrolling smoother.

            ### ⚠️ About v7.0
            v7.0 was built without the v6.x changes and carried a lower internal version number than v6.4, so phones running v6.4 refused to install it as an update. **v7.1 installs over v6.4 and v7.0 directly - no uninstall needed, your watch history and My List are kept.**

            ### 🚀 What's new in v7.1:

            - **All v6.4 features are back**: history opens the title page, the next episode is prepared ahead and starts by itself, SUB/DUB switching keeps your position, the back gesture steps back one screen, and the Next Episode button matches Skip Outro.
            - **Swipe through Trending**: the featured banner at the top of Home can now be swiped, with page dots, and still auto-advances (it pauses while you're touching it). Its **My List** button now actually adds the title.
            - **Faster playback start**: if a server is slow to respond, the next one is tried in parallel after 2.5 s instead of waiting up to 30 s; a resumed episode no longer downloads its opening first; a stalled CDN connection is retried after 12 s instead of 45 s.
            - **Better "More Like This"**: suggestions come from community recommendations for the exact title (sequels borrow the main series' recommendations), instead of falling back to generic genre lists.
            - **Smoother scrolling**: list cards and episode tiles are flat surfaces instead of live blurred glass, which was re-rendered on every scroll frame.
            - **Better player behaviour**: pauses for calls and when headphones are unplugged; segment downloads are retried more patiently on flaky connections.
            - **Honest errors**: when the site can't be reached, Home and the episode list show a "Try again" button - no more placeholder titles, invented episode lists or demo video.
            - **Safer library**: damaged or leftover placeholder entries in watch history are skipped instead of breaking a screen.

            ### 📦 Download:
            Download **`AniStream-v7.1.apk`** below and install or update on any Android device running Android 8.0 or later - it updates v6.x and v7.0 in place.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
