name: Build AniStream v4.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v4.0-APK
          path: build-output/AniStream-v4.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v4.0.apk
          tag_name: v4.0
          name: AniStream v4.0 Release
          body: |
            ## AniStream v4.0 - Android Anime Streaming App (Powered by ani-cli)

            ### 🐛 Bug fixes in this update:

            - **Episode picker not scrolling**: the native episode/subtitle/quality bottom sheet had no scroll container at all, so an anime with a long episode list overflowed the screen with no way to reach the rest. It's now wrapped in a capped-height `ScrollView`.
            - **Video not loading**: reverted the native player's media source construction back to the explicit HLS/Progressive branching this app always used, instead of relying on `DefaultMediaSourceFactory`'s file-extension-based auto-detection, which can misdetect real/proxied stream URLs that don't carry a recognizable extension. Subtitle merging is preserved via an explicit `MergingMediaSource`. **Note:** this could not be reproduced or confirmed fixed from the dev sandbox (no access to the live streaming site or a real device) - it's the most likely diagnosis based on what changed since the last working build. Please confirm on-device and report back if it still doesn't play.
            - **Skip Intro/Outro ported to native, and Outro added to both platforms**: the web player only had "Skip Intro" (from AniSkip's real per-episode data); the native player had a fake hardcoded skip range that didn't match every anime/episode. Both platforms now look up real per-episode opening *and* ending timestamps from AniSkip and only show a Skip button when real data exists for that anime/episode - never a guessed range.

            ### 📦 Download:
            Download **`AniStream-v4.0.apk`** below and install on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
