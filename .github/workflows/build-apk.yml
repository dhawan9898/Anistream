name: Build AniStream v2.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v2.0-APK
          path: build-output/AniStream-v2.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v2.0.apk
          tag_name: v2.0
          name: AniStream v2.0 Release
          body: |
            ## AniStream v2.0 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 Updates in this build:
            - **Redesigned UI**: Floating Apple-TV-style liquid glass dock navigation, specular glass panels, and smoother screen transitions.
            - **Dark & Light Themes**: New theme toggle in Settings, applied app-wide with no flash on launch.
            - **New Settings Screen**: Playback defaults (audio, quality), auto-skip intro, autoplay next episode, and data management.
            - **Fixed Skip Intro**: Now jumps to a fixed point in the episode instead of behaving like a generic forward button, and respects the auto-skip preference.
            - **Neutral Selection Styling**: Active tabs, toggles, and menus use frosted glass highlights instead of flat blue fills.

            ### 📦 Download:
            Download **`AniStream-v2.0.apk`** below and install on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
