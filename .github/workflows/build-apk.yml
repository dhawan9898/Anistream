name: Build AniStream v7.0 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v7.0) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v7.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v7.0-APK
          path: build-output/AniStream-v7.0.apk
          retention-days: 30

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v7.0.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v7.0 - Android Anime Streaming App (Powered by ani-cli)

            v7.0 is a stability release: playback recovers on its own from network hiccups, a dead server no longer stops an episode, and the app tells you honestly when something can't load instead of showing placeholder content.

            ### 🚀 What's new in v7.0:

            - **Self-healing playback**: if your connection drops or a server hiccups mid-episode, the player retries by itself (with a spinner) and carries on from the same spot - no more error screens for a brief network blip.
            - **Retry resumes where you were**: tapping Retry after a playback error, or when an episode fails to load, fetches a fresh stream link and continues from your position instead of restarting at 0:00.
            - **Multi-server fallback**: when one streaming mirror is down, the app automatically tries the other servers for your chosen Sub/Dub instead of giving up.
            - **Faster next episode**: the next episode is prepared in the background near the end of the current one, so it starts almost instantly.
            - **Smarter networking**: requests retry automatically on temporary failures, never hang, and repeat visits to pages load instantly from a short-lived cache.
            - **Better player behaviour**: pauses for phone calls and when headphones are unplugged, and keeps the screen awake only while playing.
            - **Honest error states**: when the streaming site can't be reached, Home, Search and episode lists now show a clear message with a "Try again" button - the old placeholder titles, sample search results and demo video are gone.
            - **More robust storage**: watch history, My List and settings are validated on load, so a damaged entry can no longer crash a screen.
            - **Lighter app start**: the web player is loaded only when needed, cutting the startup bundle by about two thirds.
            - Plus everything from v5.0: tablet & landscape layouts, debounced search, serialized history saves, genre browsing, Collection / More Like This and the Netflix-style player.

            ### 📦 Download:
            Download **`AniStream-v7.0.apk`** below and install or update on any Android device running Android 8.0 or later - it installs over v5.0 and keeps your watch history.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
