name: Build AniStream v4.1 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v4.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v4.1-APK
          path: build-output/AniStream-v4.1.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v4.1.apk
          tag_name: v4.1
          name: AniStream v4.1 Release
          body: |
            ## AniStream v4.1 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 Highlights & Bug Fixes in v4.1:

            - **Video Playback ("Content Malformed") Fixed**:
              - Refactored native Android ExoPlayer to use `DefaultMediaSourceFactory` with explicit `MimeTypes.APPLICATION_M3U8` and `setSubtitleConfigurations`.
              - Fixed dev-server `/stream-proxy` M3U8 tag URI rewriting (`URI="..."`) and relative segment URL calculations so sub-playlists, audio tracks, init segments, and AES-128 encryption keys proxy cleanly without resolving to `index.html`.
              - Corrected HLS format detection in web player component.
            - **Seamless App Updates (No Reinstall Required)**:
              - Configured persistent signing using `release.keystore` across debug and release builds.
              - Incremented `versionCode` to 5 (`versionName` 4.1). Existing installations can now update directly in-place without losing watch history or data.
            - **Featured Feed & Scraper Updates**:
              - Updated featured anime IDs to valid `hianime.at` numeric IDs and added automatic title-search recovery for episode list resolving.

            ### 📦 Download:
            Download **`AniStream-v4.1.apk`** below and install or update on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
