name: Build AniStream v4.4 APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish this build under (e.g. v4.4) - leave empty to just build, no release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AniStream-v4.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-v4.4-APK
          path: build-output/AniStream-v4.4.apk
          retention-days: 30

      - name: Create GitHub Release
        # A real tag push (refs/tags/vX.Y) always releases under that tag. A
        # manual run only releases when explicitly given a release_tag input
        # - never under whatever branch happened to be dispatched, which
        # used to create a bogus release/tag named after the branch itself.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/AniStream-v4.4.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: AniStream ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }} Release
          body: |
            ## AniStream v4.4 - Android Anime Streaming App (Powered by ani-cli)

            ### 🚀 What's new in v4.4:

            - **Browse by genre**: a Netflix-style "Categories" picker on Home, genre rows (Action, Romance, Comedy, Fantasy, Isekai), "Browse by Genre" tiles in Search, and a full genre page that keeps loading as you scroll.
            - **Collection & More Like This**: every title page now has Episodes / Collection / More Like This tabs - other seasons and related entries of the same franchise, plus recommendations. Play becomes "Resume E#" for shows you've started, and "My List" sits right under it.
            - **Netflix-style player**: back + centered title on top, bare replay-10 / play / forward-10 in the middle, a red seek bar with remaining time, and a Speed / Lock / Episodes / Audio & Subtitles / Next Ep. row at the bottom.
              - Playback speed (0.5x-1.5x), screen lock, and a full-screen Audio & Subtitles panel (audio language, subtitles and - when available - video quality).
              - Skip Intro / Skip Outro stay tappable even with the controls hidden, and a "Next Episode" button fills up during the credits and plays the next episode automatically ("Watch Credits" dismisses it).
            - **Fixes**: hidden player controls no longer swallow taps meant for double-tap seek and swipe gestures; MyAnimeList-only suggestions are matched to the right title instead of the first search result.

            ### 📦 Download:
            Download **`AniStream-v4.4.apk`** below and install or update on any Android device running Android 8.0 or later!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
