name: Daily Provider Health Check

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Check Providers Health
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Live requests to the real sites (the unit tests are offline and cannot notice a site
      # moving). A failure here mails the repository owner; the job summary says what broke.
      - name: Check the streaming site end to end
        run: node scripts/health-check.mjs
